[SUBROUTINE]
version = 3.0
icon = axis-a.png
name = _("4-axis setup")
type = kin4
help = _("<b>4-axis mill setup</b>&#10;Choose rotary letter and table vs head. Indexing uses A/B groups. Simultaneous 4-axis CAM is not generated here.")
order = act h1 ax ktype tcp

[PARAM_ACT]
name = _("Active")
icon = enable.png
type = bool
value = 1

[PARAM_H1]
name = _("Kinematics")
type = sub-header

[PARAM_AX]
name = _("Rotary axis")
type = combo
options = _("A=0:B=1:C=2")
value = 0
header = h1
icon = axis-a.png
tool_tip = _("Which rotary LinuxCNC joint this catalog drives")

[PARAM_KTYPE]
name = _("Rotary kind")
type = combo
options = _("Table (part rotates)=0:Head (spindle tilts)=1")
value = 0
header = h1
icon = group-offset.png
tool_tip = _("Table-rotary vs tilting head")

[PARAM_TCP]
name = _("Tool center point")
type = combo
options = _("Off (indexing only)=0:G43.4 TCP=1")
value = 0
header = h1
icon = tool.png
tool_tip = _("G43.4 needs a LinuxCNC kinematics module that supports TCP")

[DEFINITIONS]
content =

[BEFORE]
content =
	(begin #sub_name)
	(ProtonCAM 4-axis setup — CNC Proton)
	#<_pcam_rotary> = #param_ax
	#<_pcam_rot_kind> = #param_ktype
	o<#self_id_tcp> if [#param_tcp]
		G43.4
		(TCP on — tool orientation follows kinematics)
	o<#self_id_tcp> else
		(indexing mode — use Rotary Index groups for A/B)
	o<#self_id_tcp> endif
	(end #sub_name)

[AFTER]
content =
	o<#self_id_tcp_off> if [#param_tcp]
		G43
	o<#self_id_tcp_off> endif
