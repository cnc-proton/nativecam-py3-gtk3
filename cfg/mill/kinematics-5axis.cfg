[SUBROUTINE]
version = 3.0
icon = axis-a.png
name = _("5-axis setup")
type = kin5
help = _("<b>5-axis mill setup</b>&#10;Primary + secondary rotary. Simultaneous 5-axis toolpaths are not generated yet; this sets kinematics and optional G43.4 TCP.")
order = act h1 pax sax ktype tcp

[PARAM_ACT]
name = _("Active")
icon = enable.png
type = bool
value = 1

[PARAM_H1]
name = _("Kinematics")
type = sub-header

[PARAM_PAX]
name = _("Primary rotary")
type = combo
options = _("A=0:B=1:C=2")
value = 0
header = h1
icon = axis-a.png
tool_tip = _("First rotary (often the table)")

[PARAM_SAX]
name = _("Secondary rotary")
type = combo
options = _("A=0:B=1:C=2")
value = 1
header = h1
icon = axis-a.png
tool_tip = _("Second rotary (table or head)")

[PARAM_KTYPE]
name = _("Machine type")
type = combo
options = _("Table-table=0:Table-head=1:Head-head=2")
value = 0
header = h1
icon = group-offset.png

[PARAM_TCP]
name = _("Tool center point")
type = combo
options = _("Off (indexing)=0:G43.4 TCP=1")
value = 0
header = h1
icon = tool.png
tool_tip = _("Requires LinuxCNC 5-axis kinematics with TCP")

[DEFINITIONS]
content =

[BEFORE]
content =
	(begin #sub_name)
	(ProtonCAM 5-axis setup — CNC Proton)
	#<_pcam_primary> = #param_pax
	#<_pcam_secondary> = #param_sax
	#<_pcam_5ax_kind> = #param_ktype
	o<#self_id_tcp> if [#param_tcp]
		G43.4
		(TCP on)
	o<#self_id_tcp> else
		(5-axis indexing — use A and B index groups)
	o<#self_id_tcp> endif
	(end #sub_name)

[AFTER]
content =
	o<#self_id_tcp_off> if [#param_tcp]
		G43
	o<#self_id_tcp_off> endif
