[SUBROUTINE]
version = 3.0
icon = tool-change.png
name = _("Live tool / C axis")
type = live-tool
help = _("<b>Mill-turn live tooling</b>&#10;Switch from turning spindle to driven tool and optional C-axis lock. Pair with mill drill/side-drill items.")
order = act h1 mode cang tnum rpm

[PARAM_ACT]
name = _("Active")
icon = enable.png
type = bool
value = 1

[PARAM_H1]
name = _("Live tool")
type = sub-header

[PARAM_MODE]
name = _("Mode")
type = combo
options = _("Turning (M5 live off)=0:Live tool + C lock=1:Live tool polar (XY)=2")
value = 1
header = h1
icon = lathe-tool-change.png

[PARAM_CANG]
name = _("C angle")
type = float
digits = 2
value = 0
header = h1
icon = angle.png
suffix = &#176;
tool_tip = _("C position before milling")

[PARAM_TNUM]
name = _("Live tool number")
type = int
minimum_value = 0
value = 0
header = h1
icon = tool.png
tool_tip = _("0 = keep current tool")

[PARAM_RPM]
name = _("Live tool RPM")
type = int
minimum_value = 0
value = 3000
header = h1
icon = tool-spindle.png

[DEFINITIONS]
content =

[BEFORE]
content =
	(begin #sub_name)
	(ProtonCAM mill-turn live tool — CNC Proton)
	o<#self_id_act> if [#param_act]
		o<#self_id_m0> if [#param_mode EQ 0]
			M5
			(turning spindle — live tool off)
		o<#self_id_m0> endif
		o<#self_id_m1> if [#param_mode EQ 1]
			M5
			G0 C#param_cang
			M19
			o<#self_id_t> if [#param_tnum GT 0]
				T#param_tnum M6
			o<#self_id_t> endif
			M3 S#param_rpm
			(live tool, C locked)
		o<#self_id_m1> endif
		o<#self_id_m2> if [#param_mode EQ 2]
			G112
			o<#self_id_t2> if [#param_tnum GT 0]
				T#param_tnum M6
			o<#self_id_t2> endif
			M3 S#param_rpm
			(polar interpolation if the control supports G112)
		o<#self_id_m2> endif
	o<#self_id_act> endif
	(end #sub_name)

[AFTER]
content =
	o<#self_id_polar_off> if [#param_act AND [#param_mode EQ 2]]
		G113
	o<#self_id_polar_off> endif
