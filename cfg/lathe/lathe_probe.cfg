[SUBROUTINE]
version = 2.0b
icon = probe-edge.png
name = _("Lathe Probe")
type = lathe_probe
help = _("<b>Touch probe along X or Z</b>&#10;Uses G38.2 search then optional G10 touch-off.")
order = act h1 axis dir clr touch

[PARAM_ACT]
name = _("Active")
icon = enable.png
type = bool
value = 1

[PARAM_H1]
name = _("Options")
type = sub-header

[PARAM_AXIS]
name = _("Axis")
type = combo
options = _("X diameter=0:Z=1")
icon = x.png
tool_tip = _("Axis to probe toward the workpiece")
value = 0
header = h1

[PARAM_DIR]
name = _("Direction")
type = combo
options = _("Toward spindle center=1:Toward OD=-1")
icon = sel+-.png
value = 1
header = h1
tool_tip = _("X: 1 moves toward spindle center. Z: 1 moves toward tailstock.")

[PARAM_CLR]
name = _("Retract")
type = float
minimum_value = 0.0
icon = safe-z-rel.png
tool_tip = _("Pull back after the probe hit")
value = 0.125
metric_value = 3.0
header = h1

[PARAM_TOUCH]
name = _("Touch off axis")
type = bool
icon = touch-off.png
tool_tip = _("Set probed axis to zero in the current fixture")
value = 1
header = h1

[CALL]
content =
	(begin #sub_name)
	(lathe probe — CNC Proton)
	o<#self_id_ena> if [#param_act]
		#<temp_x#ID> = #<_x>
		#<temp_z#ID> = #<_z>

		o<#self_id_x> if [#param_axis EQ 0]
			o<probe> call [#param_dir] [0] [0]
			o<#self_id_xin> if [#param_dir GT 0]
				#<x#ID> = [#5061 - #<_probe_tip_dia> / 2]
				G0 X[#5061 + #<_probe_tip_dia>]
			o<#self_id_xin> else
				#<x#ID> = [#5061 + #<_probe_tip_dia> / 2]
				G0 X[#5061 - #<_probe_tip_dia>]
			o<#self_id_xin> endif
			G0 Z[#<temp_z#ID> + #param_clr]
			G0 X[#<x#ID>]
			o<#self_id_xt> if [#param_touch]
				G10 L20 P#5220 X0
			o<#self_id_xt> endif
		o<#self_id_x> endif

		o<#self_id_z> if [#param_axis EQ 1]
			o<probe> call [0] [0] [#param_dir]
			o<#self_id_zin> if [#param_dir GT 0]
				#<z#ID> = [#5063 + #<_probe_tip_dia> / 2]
				G0 Z[#5063 - #<_probe_tip_dia>]
			o<#self_id_zin> else
				#<z#ID> = [#5063 - #<_probe_tip_dia> / 2]
				G0 Z[#5063 + #<_probe_tip_dia>]
			o<#self_id_zin> endif
			G0 X[#<temp_x#ID> + #param_clr]
			G0 Z[#<z#ID>]
			o<#self_id_zt> if [#param_touch]
				G10 L20 P#5220 Z0
			o<#self_id_zt> endif
		o<#self_id_z> endif

	o<#self_id_ena> endif
	(end #sub_name)
