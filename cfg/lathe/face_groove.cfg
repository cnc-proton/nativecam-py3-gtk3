[SUBROUTINE]
version = 2.0b
icon = lathe-facing.png
name = _("Face Groove")
type = face_groove
help = _("<b>Radial grooves on the end face</b>&#10;Plunge in Z then feed along X. Cutter orient 6 or 9.")
order = act hx dia hz z hp w d s c fin

[PARAM_ACT]
name = _("Active")
icon = enable.png
type = bool
value = 1

[PARAM_HX]
name = _("Diameter span")
type = sub-header

[PARAM_DIA]
name = _("Outer diameter")
type = float
icon = x.png
value = 1.0
metric_value = 25.0
minimum_value = 0.0
not_allowed = 0
header = hx

[PARAM_ID]
name = _("Inner diameter")
type = float
icon = x-end.png
value = 0.5
metric_value = 12.0
minimum_value = 0.0
not_allowed = 0
header = hx

[PARAM_HZ]
name = _("Face")
type = sub-header

[PARAM_Z]
name = _("Face Z")
type = float
icon = z.png
value = 0.0
metric_value = 0.0
header = hz

[PARAM_HP]
name = _("Groove shape")
type = sub-header

[PARAM_W]
name = _("Radial width")
type = float
icon = width.png
value = 0.125
metric_value = 3.0
minimum_value = 0.0
not_allowed = 0
header = hp

[PARAM_D]
name = _("Axial depth")
type = float
icon = lathe-depth-step.png
value = 0.0625
metric_value = 1.5
minimum_value = 0.0
not_allowed = 0
header = hp

[PARAM_S]
name = _("Spacing")
type = float
icon = copies.png
value = 0.25
metric_value = 6.0
minimum_value = 0.0
not_allowed = 0
header = hp
tool_tip = _("Center-to-center along radius")

[PARAM_C]
name = _("Count")
icon = copies.png
type = int
value = 1
minimum_value = 1
header = hp

[PARAM_FIN]
name = _("Spring passes")
icon = finish.png
type = int
value = 0
minimum_value = 0
header = hp


[VALIDATION]
content =
	if #param_act == 1 :
		if self.check_hash('#param_id', 0.5) >= self.check_hash('#param_dia', 1.0) :
			self.msg_inv(_('Inner diameter must be less than outer diameter'), 1)
			VALIDATED = False
		if TOOL_TABLE.get_tool_orient() not in [0, 6, 9] :
			self.msg_inv(_('Cutter orientation should be 6, 9 or 0'), 2)


[CALL]
content =
	(begin #sub_name)
	(author : Fernand Veilleux)
	o<#self_id_act> if [#param_act]
		o<face_groove> CALL [#param_dia] [#param_id] [#param_z] [#param_w] [#param_d] [#param_s] [#param_c] [#param_fin]
	o<#self_id_act> endif
	(end #sub_name)
