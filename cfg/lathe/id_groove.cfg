[SUBROUTINE]
version = 2.0b
icon = lathe-surface-id.png
name = _("ID Groove")
type = id_groove
help = _("<b>Internal axial grooves on a bore wall</b>&#10;Plunge radially then feed along Z. Cutter orient 3, 8 or 9.")
order = act hx dia hz ref b_z hp w d s c fin

[PARAM_ACT]
name = _("Active")
icon = enable.png
type = bool
value = 1

[PARAM_HX]
name = _("Diameter")
type = sub-header

[PARAM_DIA]
name = _("Groove ID")
type = float
icon = x.png
value = 0.9
metric_value = 22.0
minimum_value = 0.0
not_allowed = 0
header = hx

[PARAM_HZ]
name = _("Z axis")
type = sub-header

[PARAM_REF]
name = _("Reference Z")
type = float
value = 0.0
metric_value = 0.0
header = hz
icon = z.png

[PARAM_B_Z]
name = _("First groove Z")
icon = z-end.png
type = float
value = -1.0
metric_value = -25.0
header = hz

[PARAM_HP]
name = _("Groove shape")
type = sub-header

[PARAM_W]
name = _("Width")
type = float
icon = width.png
value = 0.125
metric_value = 3.0
minimum_value = 0.0
not_allowed = 0
header = hp

[PARAM_D]
name = _("Depth")
type = float
icon = lathe-depth-step.png
value = 0.125
metric_value = 3.0
minimum_value = 0.0
not_allowed = 0
header = hp
tool_tip = _("Radial depth into the bore wall")

[PARAM_S]
name = _("Spacing")
type = float
icon = copies.png
value = 0.5
metric_value = 12.0
minimum_value = 0.0
not_allowed = 0
header = hp

[PARAM_C]
name = _("Count")
icon = copies.png
type = int
value = 1
minimum_value = 1
header = hp

[PARAM_FIN]
name = _("Spring passes")
icon = finish.png
type = int
value = 0
minimum_value = 0
header = hp


[VALIDATION]
content =
	if #param_act == 1 :
		if TOOL_TABLE.get_tool_orient() not in [0, 3, 8, 9] :
			self.msg_inv(_('Cutter orientation should be 3, 8, 9 or 0'), 2)


[CALL]
content =
	(begin #sub_name)
	(author : Fernand Veilleux)
	o<#self_id_act> if [#param_act]
		o<id_groove> CALL [#param_dia] [#param_ref] [#param_b_z] [#param_w] [#param_d] [#param_s] [#param_c] [#param_fin]
	o<#self_id_act> endif
	(end #sub_name)
